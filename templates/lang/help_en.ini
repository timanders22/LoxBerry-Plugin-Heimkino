; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Home cinema"
K02 = "Switches an LG projector and an Xbox from the Miniserver and reports their state back through MQTT."
K03 = "What this plugin does not do"
K04 = "<b>Switch the projector on</b> — Loxone can do that itself. A virtual output with the address <code>wol://</code> and the MAC without separators as the command is enough. Going through the LoxBerry would be longer and more fragile."
K05 = "Settings on the LG projector"
K06 = "<b>The hidden menu.</b> With the remote, navigate to <i>All settings → General → Network</i> so that <i>Network</i> is highlighted — and <b>do not open it, do not click anything</b>. Then type the digits <b>8&nbsp;2&nbsp;8&nbsp;8&nbsp;8</b> briskly. A menu opens that is not visible in normal operation. If it does not: you typed too slowly, or you were already one level deeper — go all the way out and navigate there again. On older devices the entry is called <i>Network connection</i>."
K07 = "<b>There: switch on network IP control and generate a keycode</b> — eight characters, to be entered in the settings. Without a keycode the device accepts no command. A newly generated keycode invalidates the old one."
K08 = "<b>Switch on Quick Start+</b> (<i>General → Devices → Additional settings</i>). Without Quick Start+ the device disconnects its network interface in standby: port 9761 stops answering, and Wake-on-LAN does not even arrive."
K09 = "<b>LAN instead of Wi-Fi, a fixed address in the router.</b> A cable is more reliable in standby. If the address moves, everything fails without the cause being visible."
K10 = "<b>Two automatic functions that fake faults</b> (<i>General → System → Additional settings</i>): the <i>auto power off</i> switches off after four hours without operation, and there is the <i>screen saver</i>. Anyone wondering why the projector goes off „by itself“ usually finds the answer here and not in Loxone."
K11 = "Settings on the Xbox"
K12 = "<b>Power mode set to <i>sleep</i></b> (<i>Profile &amp; system → Settings → General → Power mode</i>). If it says <i>energy saving</i>, the console is really off when off and cannot be woken by anything — not even through the cloud."
K13 = "<b>Switch on remote features</b> (<i>Devices &amp; connections → Remote features</i>). The same switch the Xbox app needs."
K14 = "<b>Read off the device identity</b> (<i>System → Console info</i>): the field <b>Xbox network device identity</b>, 16 characters. Not the <i>console ID</i>, not the <i>global device ID</i>, not the <i>serial number</i>."
K15 = "<b>A fixed address, ideally over LAN.</b> In sleep mode Wi-Fi noticeably lengthens the wake-up time."
K16 = "The client secret lasts at most 24 months"
K17 = "Azure grants no longer period for a client secret — not even with a date of your own. When it expires, Microsoft answers with <code>invalid_client</code> and the console can no longer be woken from Loxone. That happens two years after setup, when nobody is thinking about it any more."
K18 = "That is why the expiry date belongs in the settings. When a new secret is saved the plugin enters 24 months by itself, shows the remaining time on the <i>Test</i> tab, writes a warning to the log from 60 days onwards and reports the date and remaining days through MQTT (<code>xbox/geheimnis_ablauf</code>, <code>xbox/geheimnis_tage</code>) — so that Loxone can send a message in good time."
K19 = "<b>Renewing:</b> create a new secret in Azure under <i>Certificates &amp; secrets</i>, enter the <i>value</i> column, repeat the sign-in, delete the old secret. The application ID and the device identity stay."
K20 = "Xbox: why through the cloud"
K21 = "The old wake packet on UDP 5050 is ignored by newer firmware versions. Measured: the packet contents, destination address and device identifier were correct, the console did not react — the Xbox app wakes the same console without trouble, and it goes through the cloud. The price is an app registration of your own with Microsoft and an internet connection."
K22 = "<b>CEC does not wake the console.</b> Under <i>General → TV &amp; A/V power options → HDMI-CEC</i> there is „console turns other devices on/off“ and „other devices can <i>turn off</i> the console“ — but no line that would let other devices <i>turn on</i> the console. So CEC can switch it off, not wake it. For switching off that means: the amplifier already takes care of it, and <code>xbox-aus</code> is then superfluous."
K23 = "<b>A hurdle at registration:</b> a personal Microsoft account without a directory can no longer register an application in the Azure portal — <i>New registration</i> then only opens a window with a <i>Cancel</i> button. A directory is needed first, through an Azure registration or the M365 developer programme."
K24 = "Proven on the devices"
K25 = "Since 30.07.2026 the plugin has been running against a real LG projector and a real Xbox Series X: projector off through IP control, projector on by Wake-on-LAN, waking and switching off the Xbox through the cloud, state messages through MQTT. Until then the far end was a stub in every test."
K26 = "Polling interval"
K27 = "An LG device accepts only one connection at a time. Too short an interval locks the app's remote out. 60 seconds is a good default."
K28 = "When nothing works"
K29 = "<i>Test → Check the environment</i> — are Python modules missing? Is the service running? Is an MQTT broker configured?"
K30 = "<i>Test → Check the encryption</i> — is the plugin calculating correctly? This test needs no device."
K31 = "<i>Test → Is the projector reachable?</i> — does port 9761 answer at all? A projector switched off in deep sleep does not answer; that is normal."
K32 = "The message „the reply could not be read“ — then the keycode is wrong. Generate a new one on the device and enter it here."
K33 = "Assign fixed IP addresses in the router. Moving addresses are the most common cause of faults that were not there yesterday."
K34 = "Xbox: the message <code>invalid_client</code> — either the <i>secret ID</i> column was copied instead of the <i>value</i>, or the secret has expired after at most 24 months. The <i>Test</i> tab shows both."
K35 = "The Xbox cannot be woken although everything is set up: check <i>power mode</i> set to <i>sleep</i> and <i>remote features</i> on the console. Without those two no wake command arrives."
