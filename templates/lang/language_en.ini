SZENE_EINGANG = "Input the scene switches to"
SZENE_BILDMODUS = "Picture mode the scene sets"
SZENE_KEINE_WOERTER = "The list of allowed values could not be fetched — <span class='sm-mono'>bin/lg_beamer.py</span> does not answer. There is a free text field here instead of a selection, and only the shape is checked. The <i>Test</i> tab, button <i>Check the environment</i>, says whether the program directory is right."
