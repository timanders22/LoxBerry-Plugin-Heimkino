SICH_WARNUNG = "<b>The file is a secret.</b> It contains the action token, the key code of the projector and the Microsoft sign-in of the Xbox - whoever has it can switch the projector and the console. Without these values all fields would look right after restoring and the plugin still would not reach the devices. Treat the file like a password: store it readable only for you (like a file with permissions 0600), do not post it in a forum and do not attach it to a bug report."
SICH_ZU_GROSS = "The file is larger than allowed — a backup of this plugin is a few kilobytes."
SZENE_AKTIV = "Use the cinema scene"
SZENE_HILFE = "A scene switches everything on with one command and tidies up when you leave — and it <b>waits for real conditions</b> instead of guessed times: until the projector control port really answers, and until the console really reports <i>On</i>. In Loxone this could only be rebuilt with timer blocks that guess. <br>Sequence for <span class='sm-mono'>kino-an</span>: Wake-on-LAN → wait until the projector answers → input → picture mode → wake the Xbox → wait until it is on. For <span class='sm-mono'>kino-aus</span> the other way round: the console first, then the projector. Empty fields are skipped. The scene runs in the <b>service</b> — it is the only place allowed to talk to the projector, because the device accepts only one connection at a time."
WAECHTER_HINWEIS = "A watchdog checks every minute whether the service is still running and restarts it if needed. If you <b>stop</b> it here, it stays stopped — the watchdog respects that and does not restart it."
XBOX_VERWENDEN = "Use the Xbox"
ZUSATZWERTE = "Read volume and mute state as well"
ZUSATZWERTE_HILFE = "<b>Off by default, and deliberately so.</b> The commands <span class='sm-mono'>CURRENT_VOL</span> and <span class='sm-mono'>MUTE_STATE</span> are proven on an LG <i>television</i>; whether a projector knows them has not been measured here. When enabled the service reads them along while the device is running. A failure does <b>not</b> set <span class='sm-mono'>last_error</span> — otherwise a convenience would make the fault report useless; it appears in the log once a day."
SICH_KOPF = "Backup of the LoxBerry plugin Heimkino. SECRET: contains the action token, the key code of the projector and the Microsoft sign-in of the Xbox. Treat it like a password, store it readable only for its owner (0600). Keys starting with an underscore are skipped when restoring."
SICH_KEIN_ABSCHNITT = "The section %s is not a set of settings."
SICH_WERT = "Invalid value for %s (%s)."
SICH_ART_FELD = "a list or object instead of a single value"
