; Heimkino - English
; Every key used here must also exist in language_de.ini.
;
; RULES FOR THIS FILE:
;   - Quote attributes in markup with SINGLE quotes: class='sm-mono'. A second
;     double quote inside a value ends it early, and it does so SILENTLY.
;   - Use typographic quotes "like this", never straight ones.
;   - A value cannot span several lines.
;   - Values that pass through hk_te() (labels, headings, button captions,
;     all PRUEF.*, UMG.* and ANM.*) must not contain HTML entities.

