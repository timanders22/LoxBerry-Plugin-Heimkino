BT_HINWEIS = "The template <i>Heimkino Bild und Ton</i> contains twelve further commands: set the volume (analog value of a slider), input HDMI 1 to 4 and seven picture modes – list in step 7, page “Heimkino Bild und Ton”. It is a separate file so that an already imported template <i>Heimkino steuern</i> stays unchanged; it also contains the action token. The titles of all commands are fixed in German so that they are named in Loxone Config as in the sample project."

