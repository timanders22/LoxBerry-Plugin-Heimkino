SZENE_HAUSEREIGNIS_HILFE = "Off by default. When on, the service sends <span class='sm-mono'>haus/szene/kino = 1</span> when <span class='sm-mono'>kino-an</span> starts and <span class='sm-mono'>= 0</span> when <span class='sm-mono'>kino-aus</span> starts, <b>retained</b> and <b>without</b> the topic prefix – one fixed topic for the shading guard, lighting and Loxone. It is only sent when the cinema scene and MQTT are on as well. Switching it off and uninstalling clear the topic at the broker."
