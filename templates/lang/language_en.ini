SICH_ALTWERT_KOPF = "Attention: restoring would reject these values: %1. Correct them before restoring."
WAS_IST_DAS = "<b>Switches an LG projector (or TV from model year 2018) and an Xbox from the Loxone Miniserver</b> and reports their state back over MQTT. A service on the LoxBerry fills exactly the gaps Loxone cannot close on its own: switching the projector off encrypted over the home network (Loxone can switch it on by Wake-on-LAN itself) and switching the Xbox on and off through the Microsoft cloud service. The commands come from the Miniserver through a virtual output."

[BEAMER]
EINRICHTUNG = "<b>Four settings on the device, without which the plugin has no effect.</b> <b>1.</b> Open the hidden menu: with the remote control move to <i>All settings → General → Network</i> so that <i>Network</i> is highlighted — and <b>do not open it, do not click anything</b>. Then quickly type <b>8 2 8 8 8</b>. If it does not work you were too slow or one level too deep; on older devices the entry is called <i>Network connection</i>. <b>2.</b> Switch on <i>Network IP control</i> there and <b>generate a keycode</b> — eight characters, to be entered below. Without it the device accepts no command; a new keycode invalidates the old one. <b>3.</b> Switch on <i>Quick Start+</i> (<i>General → Devices → Additional settings</i>) — without it the device disconnects the network interface in standby, port 9761 stops answering and Wake-on-LAN never arrives. <b>4.</b> Cable instead of Wi-Fi and a <b>fixed address</b> in the router; if it moves, everything fails without the cause being visible. <br><b>Two automatic functions that fake a fault</b> (<i>General → System → Additional settings</i>): the <i>auto power off</i> after four hours without input, and the <i>screen saver</i>. If you wonder why the projector switches off “by itself”, the answer is usually here and not in Loxone."

[XBOX]
EINRICHTUNG = "<b>Settings on the console.</b> Without the first two no wake command arrives — not even through the cloud. <b>1. Power mode set to <i>Sleep</i></b> (<i>Profile &amp; system → Settings → General → Power mode</i>). If it says <i>Energy saving</i>, the console is really off when off and nothing can wake it. <b>2. Enable remote features</b> (<i>Devices &amp; connections → Remote features</i>) — the same switch the Xbox app needs. <b>3. Read the device ID</b> (<i>System → Console info</i>): field <b>Xbox network device ID</b>, 16 characters. <b>4. HDMI-CEC</b> (<i>General → TV &amp; display options → HDMI-CEC</i>) for switching the amplifier off. <br><b>CEC cannot wake the console.</b> It only knows: the console switches other devices on, the console switches other devices off, other devices may <i>turn the console off</i>. There is no line saying other devices may switch the console on — checked on screen, not assumed. Practical consequence: <span class='sm-mono'>xbox-aus</span> is often superfluous because the amplifier already does it via CEC."
H_ANMELDUNG = "Xbox: signing in to Microsoft"
CLOUD_WARUM = "The unauthenticated wake packet on UDP 5050 that Xbox One consoles accepted is ignored by newer firmware. Measured on a Series X: packet contents, destination address and device ID were correct, the console did not react — the Xbox app wakes the same console without trouble, and it goes through the Microsoft cloud service. That is why this plugin takes the same route. The price: an app registration of your own, a one-time sign-in and an internet connection."
VERZEICHNIS = "<b>The prerequisite most people fail at:</b> the registration needs a <b>directory</b> (tenant). A personal Microsoft account has none. Under <i>App registrations</i> it then says the account is associated but not contained in any directory, and <i>New registration</i> opens no form but a window with a single button: <i>Cancel</i>. You obtain a directory through an <b>Azure registration</b> (free account, requires payment details for identity verification) or the <b>M365 developer program</b>. <b>Afterwards sign out and sign in again</b> — the portal session carries the directory membership; a session from before does not know the new directory and reports <span class='sm-mono'>AADSTS16000</span>."
SCHRITT0 = "<b>Step 0 — check that the directory is really there.</b> In the Azure portal click your account name at the top right, then <i>Switch directory</i>. Under <i>All directories</i> one must be listed and selected. If it says no directories were found, everything else is pointless."
SCHRITT1 = "<b>Step 1 — register the application.</b> <i>App registrations → New registration</i>. <b>Name</b> free of choice. <b>Supported account types: personal Microsoft accounts only</b> — the console belongs to a personal account; the directory is only needed to be allowed to create the application at all. <b>Redirect URI:</b> type <b>Web</b>, address exactly <span class='sm-mono'>%1</span>."
SCHRITT2 = "<b>Step 2 — copy the ID.</b> The <i>Overview</i> page shows <b>Application (client) ID</b>. It is not a secret. Do not confuse it with <i>Directory (tenant) ID</i> or <i>Object ID</i> right below it."
SCHRITT3 = "<b>Step 3 — create the secret.</b> <i>Certificates &amp; secrets → Client secrets → New client secret</i>. The table then shows four columns: <i>Description</i>, <i>Expires</i>, <b>Value</b> and <i>Secret ID</i>. <b>What is needed is the Value column.</b> The Secret ID column is <b>not</b> — it looks like an identifier and is therefore confused regularly. And Value is visible <b>only this one time</b>: leave the page and you will never see it again and must create a new secret."
SCHRITT4 = "<b>Step 4 — sign in.</b> Open this address in a browser and sign in with the Microsoft account the console belongs to."
SCHRITT4_HILFE = "The browser then lands on a page that does not load — that is correct. What matters is the address bar: it contains <span class='sm-mono'>?code=…</span>. Copy the whole address and paste it below."
INVALID_CLIENT = "If Microsoft reports <span class='sm-mono'>invalid_client</span> here, it is one of two things: <b>1.</b> The wrong column was copied — <i>Secret ID</i> instead of <i>Value</i>. By far the most common case; the <b>Test → Check sign-in data</b> button says what shape the stored secret has, without showing it. <b>2.</b> The secret has expired. If it persists although the <i>Value</i> column was freshly copied, the other sign-in service helps: set <span class='sm-mono'>dienst: v2</span> in <span class='sm-mono'>xbox_auth.json</span>. Some registrations are accepted by only one of the two. <br>If Microsoft reports <span class='sm-mono'>invalid_grant</span> instead, the refresh token has expired — the plugin then discards the stored sign-in itself and a new one is due here."
ANGEMELDET = "Signed in. The refresh token is present; a new sign-in is only needed once Microsoft rejects it."
NICHT_ANGEMELDET = "Not signed in yet."

