BEAMER_KEYCODE = "Keycode (8 characters, UPPERCASE)"
BEAMER_KEYCODE_HILFE = "Generate it on the device: move to <i>All settings &rarr; General &rarr; Network</i>, then type <b>82888</b> &rarr; switch on Network IP control &rarr; generate keycode. The device writes it in upper case — enter it exactly like that. It is <b>not</b> converted: the key is derived from these eight characters, and in lower case it would be a different one."
BEAMER_PORT = "Port"
BEAMER_ZEITGRENZE = "Timeout in seconds"
XBOX_ID = "Xbox network device ID"
XBOX_ID_HILFE = "It is <b>not</b> in Azure — Azure only knows the application, not the console. Two sources: <b>Test &rarr; Search consoles</b> fetches the list of all consoles of the account together with their IDs; or read it on the console under <i>System &rarr; Console info</i>, 16 characters. Not the <i>Console ID</i>, not the <i>Global device ID</i>, not the <i>Serial number</i>. What belongs here is the <b>device ID</b>, not the <b>name</b> of the console."
XBOX_APP = "Application ID"
XBOX_ANMELDUNG = "Microsoft sign-in"
FRIST = "Client secret valid until (YYYY-MM-DD, empty = no warning)"
FRIST_HILFE = "<b>The client secret lasts at most 24 months.</b> Azure grants no longer period. When it expires, Microsoft answers with <span class='sm-mono'>invalid_client</span> and the console can no longer be woken from Loxone — two years after setup, when nobody thinks of it any more. The service reports the date and the remaining days over MQTT and writes a warning to the log from 60 days on. <b>Renewing:</b> create a new secret in Azure, enter the <i>Value</i> column, repeat the sign-in, delete the old one. Application ID and device ID stay unchanged."
