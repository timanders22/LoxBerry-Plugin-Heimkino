ABO_UNBEKANNT = "The gateway version could not be read, so both cases are shown. Which one applies is shown under <i>System → MQTT Gateway</i>."
ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — there is nothing to enter here. The group appears under <i>Subscriptions</i>, where the desired data points are ticked individually. The topic tree is:"
THEMEN_RETAINED = "<b>Device states</b> are sent <b>retained</b>: a newly connected client immediately receives the latest state instead of waiting for the next cycle. The heartbeat <span class='sm-mono'>service/zeitstempel</span>, values that age by themselves (runtime of the day: <span class='sm-mono'>beamer/laufzeit_heute</span>, <span class='sm-mono'>xbox/laufzeit_heute</span>; days until expiry: <span class='sm-mono'>xbox/geheimnis_tage</span>) and everything the service says about itself (error: <span class='sm-mono'>last_error</span>; reachability and sign-in: <span class='sm-mono'>beamer/erreichbar</span>, <span class='sm-mono'>beamer/grund</span>, <span class='sm-mono'>xbox/erreichbar</span>, <span class='sm-mono'>xbox/angemeldet</span>; results of commands: <span class='sm-mono'>beamer/letzte_aktion</span>, <span class='sm-mono'>xbox/letzte_aktion</span>; progress and result of the scene: <span class='sm-mono'>szene/laeuft</span>, <span class='sm-mono'>szene/schritt</span>, <span class='sm-mono'>szene/ergebnis</span>) are sent <b>without</b> retain — an old value would otherwise look fresh. If the service could not query a device (unreachable, sign-in or client secret expired or similar), its states are <b>not sent at all</b> in that cycle, no substitute values either: the broker and Loxone keep the last measured state, only <span class='sm-mono'>beamer/erreichbar</span> or <span class='sm-mono'>xbox/erreichbar</span> goes to 0. A device switched off in the settings receives placeholders <b>once</b>, retained (<i>-</i> for text, -1 for numbers, 0 for the digital inputs <span class='sm-mono'>…/an</span> and <span class='sm-mono'>xbox/geheimnis_datum_bekannt</span>); after that only <span class='sm-mono'>…/aktiv</span> = 0 is sent for it in each cycle. The <i>retained</i> column comes from the same list the service sends by. <span class='sm-mono'>service/online</span> additionally carries a <b>last will</b> — if the service connection breaks, the broker sets the value to 0 by itself. Uninstalling removes all retained topics of the plugin from the broker."
HAUS_AN = "In addition, without prefix: <span class='sm-mono'>haus/szene/kino</span> (0/1, <b>retained</b>) – the cinema scene as a house event, switched on in the Settings tab."
HAUS_AUS = "The house event <span class='sm-mono'>haus/szene/kino</span> is switched off (Settings tab, cinema scene)."

[LOX]
H_SCHRITTWEISE = "Loxone integration — step by step"
EINLEITUNG = "The plugin polls the projector and the Xbox and reports each state as its own MQTT topic (steps 1 and 2). In the other direction it accepts commands through simple addresses (step 3). From that you can build a cinema scene that switches everything on at the push of a button and tidies up when you leave."
H_SCHRITT1 = "Step 1: subscription in the MQTT gateway"
H_SCHRITT2 = "Step 2: reading the state — virtual inputs"
SCHRITT2 = "The service reports every value to the broker, states retained (column <i>retained</i> on the MQTT tab); the LoxBerry MQTT gateway forwards it to the Miniserver."
VORLAGE_HINWEIS = "The file can be imported into Loxone Config under <i>Virtual inputs</i>. <b>Loxone Config creates new objects on import and overwrites nothing</b> — importing twice means duplicate objects. The <b>text topics are deliberately left out of the template</b>: the reproduced file format is only proven for numeric values. They are listed in the table above and can be created by hand if needed. The address in the header is a suggestion — please check that the Miniserver reaches the LoxBerry under this name."
VORLAGE_KOMMENTAR = "Created by the LoxBerry plugin Heimkino (%1)"
VO_KOMMENTAR = "Action calls through the Heimkino plugin — contains the action token."
H_SCHRITT3 = "Step 3: switching — virtual output"
SCHRITT3 = "Create a <b>virtual output</b> in Loxone Config. It carries only the address of the LoxBerry; the commands go into the <b>virtual output commands</b> below it. No user and no password — the action endpoint sits in the unauthenticated area and checks the token instead. Instead of the host name the IP address of the LoxBerry works too."
KEIN_TOKEN = "There is no action token yet. Save once on the <i>Settings</i> tab, then the complete addresses appear here."
SP_FELD = "Field"
SP_WERT = "Value"
SP_BEFEHL = "Output command"
SP_EIN = "Command on ON (method GET)"
ADRESSE_AUSGANG = "Address of the output"
FLANKE = "A virtual output command fires on the 0→1 edge, not continuously. For <span class='sm-mono'>beamer-taste</span> and <span class='sm-mono'>beamer-eingang</span> put the desired name in place of <span class='sm-mono'>WERT</span>; letters, digits and underscore are allowed, and upper and lower case are preserved."
H_SCHRITT4 = "Step 4: checking the address without switching"
SCHRITT4 = "Every action endpoint answers a self-test. It checks <b>only</b> whether the token is correct: no device contact, no write access, nothing is switched. That makes it possible to check an installation without the projector shutting down."
SELFTEST_ANTWORT = "Answer with the correct token: <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span> with HTTP 200. With a wrong token <span class='sm-mono'>SELFTEST;OK=0;ERR=TOKEN</span> with HTTP 403, without a token set up <span class='sm-mono'>SELFTEST;OK=0;ERR=KEIN_TOKEN_EINGERICHTET</span>."
H_SCHRITT5 = "Step 5: detecting an outage"
AUSFALL = "<b>Virtual inputs keep their last value.</b> If the service fails, everything looks normal in the app — the values simply stand still. Two topics detect that: <span class='sm-mono'>%1/service/online</span> goes to 0 as soon as the service connection breaks (the broker does that itself through the last will), and <span class='sm-mono'>%1/service/zeitstempel</span> carries the Unix time of the last poll. Put an <i>analog value validation</i> on the timestamp (Tmc three times the polling interval, constant 1 at En): its output E reports when it has not changed for that long; together with <span class='sm-mono'>service/online</span> = 0 (through a NOT) both go through an OR into a notification – page “Heimkino”, #14 to #23 in step 7. Set the threshold well above the interval, otherwise a single missed cycle already raises an alarm. For Loxone subtract 1230768000 from the Unix time."
H_SCHRITT6 = "Step 6: tile in the app"
SCHRITT6 = "The tile is the <i>status</i> block “Heimkino” (#13 of the page “Heimkino” in step 7): connect <span class='sm-mono'>V1</span> with <span class='sm-mono'>beamer_an</span> and <span class='sm-mono'>V2</span> with <span class='sm-mono'>xbox_an</span>, and enter the four status rows from the column <i>Parameters</i> by hand – the row without condition last. Tick <i>Use in visualisation</i>. Further tiles (service, cinema scene, devices, last commands) are also in step 7."
H_SCHRITT7 = "Step 7: four complete block lists to rebuild"
BAUSTEINE_EINLEITUNG = "Four pages from the LoxBerry plugins sample project, every row one block (block search in Loxone Config: key <b>F5</b>). The first shows whether the cinema is running, starts the cinema scene and reports failures – it is enough to start with. The second puts the commands to the projector and the Xbox into the app as buttons (the doorbell hides the picture), the third shows connection and values of the devices, the fourth sets volume, HDMI input and picture mode. The inputs come from the template of step 2, the commands from the templates of step 3; the MQTT gateway assigns the input names – keep them as they are."
SP_BAUSTEIN = "Block (type)"
SP_NAME = "Name (suggestion)"
SP_PARAMETER = "Parameters"
SP_VERBINDEN = "Connect inputs to"
H_SCHRITT8 = "Step 8: cross-check"
GEGENPROBE = "How to check that it arrived, without switching anything: <b>1.</b> On the <i>Test</i> tab look at the row <i>Does our own endpoint answer?</i> — it really calls the self-test address. <b>2.</b> In the MQTT gateway under <i>Incoming overview</i> search for <span class='sm-mono'>%1/</span>; all topics must be there with a value. <b>3.</b> In Loxone Config watch the virtual inputs in the monitor and stop the service once — <span class='sm-mono'>service/online</span> must go to 0 within a few seconds. If it stays at 1, the last will is not getting through and the outage detection would not hold."
SZENE = "<b>The cinema scene is the shorter route.</b> Instead of wiring four output commands and guessing the waiting times with timer blocks, one virtual output with <span class='sm-mono'>kino-an</span> and <span class='sm-mono'>kino-aus</span> is enough. The service works through the steps and waits for real conditions: until the control port really answers and until the console really reports <i>On</i>. The call returns immediately — Loxone does not wait. Where the scene currently stands is in <span class='sm-mono'>szene/schritt</span>; how it ended, in <span class='sm-mono'>szene/ergebnis</span>."
BREMSE = "<b>The same set value goes out at most once per minute.</b> For <span class='sm-mono'>beamer-aus</span>, <span class='sm-mono'>kino-an</span>/<span class='sm-mono'>kino-aus</span>, <span class='sm-mono'>beamer-lautstaerke</span>, <span class='sm-mono'>beamer-eingang</span>, <span class='sm-mono'>beamer-bildmodus</span>, <span class='sm-mono'>beamer-energie</span>, <span class='sm-mono'>beamer-bild-an</span>/<span class='sm-mono'>-aus</span>, <span class='sm-mono'>beamer-stumm-an</span>/<span class='sm-mono'>-aus</span> and <span class='sm-mono'>xbox-an</span>/<span class='sm-mono'>xbox-aus</span>: if the same command with the same value arrives again within 60 s, the endpoint answers HTTP 200 with <span class='sm-mono'>UNVERAENDERT=1</span> and sends nothing. A different value goes out at once. After switching on or off, a cinema scene or a key, nothing counts as remembered any more. <span class='sm-mono'>beamer-taste</span>, <span class='sm-mono'>beamer-app</span> and <span class='sm-mono'>beamer-wol</span> (Wake-on-LAN without feedback) always go out. For the Xbox, in addition, a different value at most every 10 s (otherwise 429)."
BILD_ALT = "Plugin blocks in Loxone Config – page “%s”"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
