SICH_WARNUNG = "<b>The file contains your credentials.</b> Without them all fields would look right after restoring and the plugin still would not reach the installation. Treat the file like a password: do not post it in a forum and do not attach it to a bug report."
SICH_ZU_GROSS = "The file is larger than allowed — a backup of this plugin is a few kilobytes."
SZENE_AKTIV = "Use the cinema scene"
SZENE_HILFE = "A scene switches everything on with one command and tidies up when you leave — and it <b>waits for real conditions</b> instead of guessed times: until the projector control port really answers, and until the console really reports <i>On</i>. In Loxone this could only be rebuilt with timer blocks that guess. <br>Sequence for <span class='sm-mono'>kino-an</span>: Wake-on-LAN &rarr; wait until the projector answers &rarr; input &rarr; picture mode &rarr; wake the Xbox &rarr; wait until it is on. For <span class='sm-mono'>kino-aus</span> the other way round: the console first, then the projector. Empty fields are skipped. The scene runs in the <b>service</b> — it is the only place allowed to talk to the projector, because the device accepts only one connection at a time."
WAECHTER_HINWEIS = "A watchdog checks every minute whether the service is still running and restarts it if needed. If you <b>stop</b> it here, it stays stopped — the watchdog respects that and does not restart it."
XBOX_VERWENDEN = "Use the Xbox"
ZUSATZWERTE = "Read volume and mute state as well"
ZUSATZWERTE_HILFE = "<b>Off by default, and deliberately so.</b> The commands <span class='sm-mono'>CURRENT_VOL</span> and <span class='sm-mono'>MUTE_STATE</span> are proven on an LG <i>television</i>; whether a projector knows them has not been measured here. When enabled the service reads them along while the device is running. A failure does <b>not</b> set <span class='sm-mono'>last_error</span> — otherwise a convenience would make the fault report useless; it appears in the log once a day."

[BEAMER]
EINRICHTUNG = "<b>Four settings on the device, without which the plugin has no effect.</b> <b>1.</b> Open the hidden menu: with the remote control move to <i>All settings &rarr; General &rarr; Network</i> so that <i>Network</i> is highlighted — and <b>do not open it, do not click anything</b>. Then quickly type <b>8 2 8 8 8</b>. If it does not work you were too slow or one level too deep; on older devices the entry is called <i>Network connection</i>. <b>2.</b> Switch on <i>Network IP control</i> there and <b>generate a keycode</b> — eight characters, to be entered below. Without it the device accepts no command; a new keycode invalidates the old one. <b>3.</b> Switch on <i>Quick Start+</i> (<i>General &rarr; Devices &rarr; Additional settings</i>) — without it the device disconnects the network interface in standby, port 9761 stops answering and Wake-on-LAN never arrives. <b>4.</b> Cable instead of Wi-Fi and a <b>fixed address</b> in the router; if it moves, everything fails without the cause being visible. <br><b>Two automatic functions that fake a fault</b> (<i>General &rarr; System &rarr; Additional settings</i>): the <i>auto power off</i> after four hours without input, and the <i>screen saver</i>. If you wonder why the projector switches off “by itself”, the answer is usually here and not in Loxone."

[XBOX]
EINRICHTUNG = "<b>Settings on the console.</b> Without the first two no wake command arrives — not even through the cloud. <b>1. Power mode set to <i>Sleep</i></b> (<i>Profile &amp; system &rarr; Settings &rarr; General &rarr; Power mode</i>). If it says <i>Energy saving</i>, the console is really off when off and nothing can wake it. <b>2. Enable remote features</b> (<i>Devices &amp; connections &rarr; Remote features</i>) — the same switch the Xbox app needs. <b>3. Read the device ID</b> (<i>System &rarr; Console info</i>): field <b>Xbox network device ID</b>, 16 characters. <b>4. HDMI-CEC</b> (<i>General &rarr; TV &amp; display options &rarr; HDMI-CEC</i>) for switching the amplifier off. <br><b>CEC cannot wake the console.</b> It only knows: the console switches other devices on, the console switches other devices off, other devices may <i>turn the console off</i>. There is no line saying other devices may switch the console on — checked on screen, not assumed. Practical consequence: <span class='sm-mono'>xbox-aus</span> is often superfluous because the amplifier already does it via CEC."
H_ANMELDUNG = "Xbox: signing in to Microsoft"
CLOUD_WARUM = "The unauthenticated wake packet on UDP 5050 that Xbox One consoles accepted is ignored by newer firmware. Measured on a Series X: packet contents, destination address and device ID were correct, the console did not react — the Xbox app wakes the same console without trouble, and it goes through the Microsoft cloud service. That is why this plugin takes the same route. The price: an app registration of your own, a one-time sign-in and an internet connection."
VERZEICHNIS = "<b>The prerequisite most people fail at:</b> the registration needs a <b>directory</b> (tenant). A personal Microsoft account has none. Under <i>App registrations</i> it then says the account is associated but not contained in any directory, and <i>New registration</i> opens no form but a window with a single button: <i>Cancel</i>. You obtain a directory through an <b>Azure registration</b> (free account, requires payment details for identity verification) or the <b>M365 developer program</b>. <b>Afterwards sign out and sign in again</b> — the portal session carries the directory membership; a session from before does not know the new directory and reports <span class='sm-mono'>AADSTS16000</span>."
SCHRITT0 = "<b>Step 0 — check that the directory is really there.</b> In the Azure portal click your account name at the top right, then <i>Switch directory</i>. Under <i>All directories</i> one must be listed and selected. If it says no directories were found, everything else is pointless."
SCHRITT1 = "<b>Step 1 — register the application.</b> <i>App registrations &rarr; New registration</i>. <b>Name</b> free of choice. <b>Supported account types: personal Microsoft accounts only</b> — the console belongs to a personal account; the directory is only needed to be allowed to create the application at all. <b>Redirect URI:</b> type <b>Web</b>, address exactly <span class='sm-mono'>%1</span>."
SCHRITT2 = "<b>Step 2 — copy the ID.</b> The <i>Overview</i> page shows <b>Application (client) ID</b>. It is not a secret. Do not confuse it with <i>Directory (tenant) ID</i> or <i>Object ID</i> right below it."
SCHRITT3 = "<b>Step 3 — create the secret.</b> <i>Certificates &amp; secrets &rarr; Client secrets &rarr; New client secret</i>. The table then shows four columns: <i>Description</i>, <i>Expires</i>, <b>Value</b> and <i>Secret ID</i>. <b>What is needed is the Value column.</b> The Secret ID column is <b>not</b> — it looks like an identifier and is therefore confused regularly. And Value is visible <b>only this one time</b>: leave the page and you will never see it again and must create a new secret."
SCHRITT4 = "<b>Step 4 — sign in.</b> Open this address in a browser and sign in with the Microsoft account the console belongs to."
SCHRITT4_HILFE = "The browser then lands on a page that does not load — that is correct. What matters is the address bar: it contains <span class='sm-mono'>?code=…</span>. Copy the whole address and paste it below."
INVALID_CLIENT = "If Microsoft reports <span class='sm-mono'>invalid_client</span> here, it is one of two things: <b>1.</b> The wrong column was copied — <i>Secret ID</i> instead of <i>Value</i>. By far the most common case; the <b>Test &rarr; Check sign-in data</b> button says what shape the stored secret has, without showing it. <b>2.</b> The secret has expired. If it persists although the <i>Value</i> column was freshly copied, the other sign-in service helps: set <span class='sm-mono'>dienst: v2</span> in <span class='sm-mono'>xbox_auth.json</span>. Some registrations are accepted by only one of the two. <br>If Microsoft reports <span class='sm-mono'>invalid_grant</span> instead, the refresh token has expired — the plugin then discards the stored sign-in itself and a new one is due here."
ANGEMELDET = "Signed in. The refresh token is present; a new sign-in is only needed once Microsoft rejects it."
NICHT_ANGEMELDET = "Not signed in yet."

