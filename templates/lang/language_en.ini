SICH_ABGELEHNT = "The file was <b>not</b> accepted — nothing has been changed:"
SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains all settings of this plugin including the action token and the <b>Xbox sign-in</b> (application ID, client secret, refresh token) and can be restored there. Every value is checked; a file with one invalid value changes nothing. If the service was running, it is restarted afterwards."
