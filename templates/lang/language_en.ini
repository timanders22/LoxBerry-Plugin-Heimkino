SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "On the plugin tab “%s”, set up the projector (%s, %s, keycode) and the Xbox (sign-in, %s, “%s”), switch on “%s”, choose input and picture mode of the scene and save. The action token is created on the first save."
S1_SCHRITT2 = "LoxBerry → MQTT Gateway → Subscriptions: enter %s (gateway V2: the group appears by itself; tick all datapoints there – including the text topics of this list). What applies to your gateway is shown above in step 1."
S1_SCHRITT3 = "Above on this tab, press “%s” (step 2) and “%s” (step 3). Check the address in the header: the Miniserver must reach the LoxBerry under this name (otherwise enter the IP address)."
S1_SCHRITT4 = "In Loxone Config: Periphery → Virtual Inputs → import template → %s; Periphery → Virtual Outputs → import template → %s. Import each file only ONCE (twice gives duplicate blocks)."
S1_SCHRITT5 = "Create a new page “Heimkino”. Drag %2$s from “%1$s” onto the page; from “%3$s” the two commands “%4$s” and “%5$s”."
S1_SCHRITT6 = "Create four text inputs (Periphery → Virtual Inputs → Virtual text input), name exactly: %s – the way the MQTT gateway names the topics (slash becomes underscore, in front the topic prefix from the MQTT tab)."
S1_SCHRITT7 = "Create the switch “Kino-Modus” (virtual input, input type switch, “Use in visualisation” on)."
S1_SCHRITT8 = "Create four notifications (Periphery → Messages → Notification): “Beamer startet nicht”, “Xbox-Geheimnis erneuern”, “Heimkino ausgefallen”, “Kino-Szene unvollständig”, texts as in the list. Each gets exactly one connection."
S1_SCHRITT9 = "Place the remaining blocks via the block search (key F5), parameters as in the list, and wire them from top to bottom according to the column “%s”. AND and OR have two inputs each. The rows of the status blocks are in the column “%s” and are entered by hand – in the given order, the row without condition last, status value as given. Status inputs from V5 on only appear after clicking the “+” on the block; the status blocks of these four pages need at most V4."
S1_SCHRITT10 = "Save and transfer to the Miniserver. Cross-check: “Heimkino-Dienst” shows “in Ordnung – letzte Abfrage …”; switch on Kino-Modus – “Kino-Szene” shows the steps, afterwards “zuletzt: kino-an vollstaendig nach … s”."
S1_H1 = "On #6 and #7: a virtual output command fires on the 0→1 edge, not continuously – hence the edge detection #5 with its two outputs On and Off. The cinema mode alone would fire exactly once when switching on and not at all when switching off."
S1_H2 = "Kino-Modus is a virtual input (switch) for the app; a push button or a scene works just as well. The edge detection sends “%s” when switching on and “%s” when switching off. For this, turn on “%4$s” on the tab “%3$s” – it is off by default, and the plugin rejects both commands."
S1_H3 = "On #9: the cinema scene waits up to 120 s for the projector, and its state arrives with the polling interval of 60 s – hence 180 s. A shorter delay reports a failed start while the plugin is still waiting."
S1_H4 = "The analog value validation (#18) only checks with the constant 1 at En. If you change the polling interval in the plugin, set Tmc to three times the new interval."
S1_H5 = "“Beamer startet nicht” (#10) and “Kino-Szene unvollständig” (#28) can both arrive for the same failed start: the first says that the projector is not on, the second which step of the scene was missing. If “%s” is off, only the first arrives – the cinema mode then switches nothing at all."
S1_H6 = "A notification only sends on a change from off to on. Never connect several sources directly to its input – merge them through an OR first, otherwise a permanently active source swallows all the others."
S1_H7 = "“Kino-Modus” stays as it is when you leave the house; if you want the cinema off after leaving, switch it off in the app – a block cannot reset the switch."
S1_H8 = "After a restart of the Miniserver, “Kino-Szene” shows “seit dem Neustart noch keine Szene gelaufen” until the next scene: the result is not retained, so that no old state looks fresh."
S1_H9 = "If you want the shading guard or the lighting to react to the cinema: switch on “%s” in the plugin; the receivers read it themselves, nothing has to be built in Loxone for it."
S1_H10 = "The template “%s” contains the action token of the plugin. After “Create a new token”, create both output templates again or adjust the addresses by hand."
S2_SCHRITT1 = "Templates as on page “Heimkino” (one import is enough for all pages)."
S2_SCHRITT2 = "New page “Heimkino Steuerung”. Drag the eight commands %2$s from “%1$s”. NOT the two “Kino-Szene: …” again – an output command may only be in the project once."
S2_SCHRITT3 = "Create eight buttons (Periphery → Virtual Inputs → Virtual input, input type push button, “Use in visualisation” on), names as in the list."
S2_SCHRITT4 = "Doorbell: if your project already has a doorbell (e.g. for Kodi or Chromecast), drag exactly that one onto the page once more and connect it to #8 “Klingel bei laufendem Beamer” (input I1). Without a doorbell of your own, create the placeholder “Türklingel (eigene Quelle)” as a button. Drag %s from the tree once more."
S2_SCHRITT5 = "Create two text inputs (Periphery → Virtual Inputs → Virtual text input), name exactly: %s."
S2_SCHRITT6 = "Create the notification “Heimkino-Befehl ohne Wirkung” (text as in the list); place AND, OR and status and wire them according to the column “%s”. AND and OR have two inputs each; the rows of the status are in the column “%s” and are entered by hand."
S2_SCHRITT7 = "Save, transfer. Test: with the projector running, press “Türklingel (eigene Quelle)” in the app – picture and sound go off; “Beamer Bild an” – the picture is back. “Letzte Befehle” shows “… gewirkt nach … s” after a switching command."
S2_H1 = "Ringing only hides the picture; the page “Kodi-NG Wiedergabe” of the Kodi plugin pauses the movie (the same placeholder). After the conversation press “Kodi abspielen” and “Beamer Bild an” – the picture does not come back by itself."
S2_H2 = "The plugin does not accept the same command twice within 60 s (answer UNVERAENDERT=1, no fault). The Xbox accepts a different command at most every 10 s."
S2_H3 = "“Beamer an” only works if “Quick Start+” is on at the projector and the MAC address in the plugin is right (tab “%s”: “%s”)."
S2_H4 = "“Letzte Befehle” only fills with the tick “%s” (on by default); “nicht feststellbar” means: the device did not answer at all – no failure, no message."
S3_SCHRITT1 = "Templates as on page “Heimkino” (no second import)."
S3_SCHRITT2 = "New page “Heimkino Geräte”. Drag the 13 inputs of the list from “%s” (%s and %s once more – that is allowed). For %s and %s switch on “Statistics” in the properties window."
S3_SCHRITT3 = "Create four text inputs (Periphery → Virtual Inputs → Virtual text input), name exactly: %s."
S3_SCHRITT4 = "Create two notifications “Beamer nicht erreichbar” and “Xbox nicht erreichbar” (texts as in the list)."
S3_SCHRITT5 = "Place five status blocks and two on-delays and wire them according to the column “%s”. The rows of the status blocks are in the column “%s” and are entered by hand in the given order – the row “fehler” of the projector connection BEFORE “Beamer antwortet”, otherwise it hides a wrong keycode."
S3_SCHRITT6 = "Save, transfer. Test: with the projector switched off, “Beamer-Verbindung” shows “Beamer aus (Standby) – normal” or “nicht im Netz”; “Xbox-Verbindung” shows “Xbox-Cloud antwortet – Konsole: …”."
S3_H1 = "A switched-off projector does not answer – that is no fault. Only what has to be set up is reported (address, name, keycode); “nicht im Netz” reports nothing, because without “Quick Start+” that is the normal case in standby."
S3_H2 = "Volume and mute stay at -1 until “%s” is switched on in the plugin; whether your projector knows them only shows then (proven on a TV, not measured on a projector)."
S3_H3 = "Operating hours are estimated (from the polling interval) and count from the first poll of this plugin version – not a lamp counter."
S4_SCHRITT1 = "Above in step 3, press “%s” and import the file %s once in Loxone Config under Periphery → Virtual Outputs → import template. The template “%s” stays unchanged."
S4_SCHRITT2 = "New page “Heimkino Bild und Ton”. Drag all twelve commands from “%s”. Create a slider “Beamer Lautstärke einstellen” (virtual input, input type slider, Min 0, Max 100, step 5) and eleven buttons (input type push button, “Use in visualisation” on), names as in the list, and wire them according to the column “%s”."
S4_SCHRITT3 = "Save, transfer. Test: press “Beamer Bild Spiel” – the projector changes the picture mode."
S4_H1 = "Which HDMI socket the LoxBerry (Kodi), the Xbox or another player uses is shown on the projector; delete buttons you do not need."
S4_H2 = "The picture mode at the start of the cinema is already set by the cinema scene (tab “%s”, “%s”) – the buttons are for switching afterwards."
S4_H3 = "The same value does not go out again within 60 s (answer UNVERAENDERT=1, no fault). None of the twelve commands has been measured on a projector; setting the volume is proven on an LG TV."
