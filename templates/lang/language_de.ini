PRAEFIX_HILFE = "Alle Themen liegen darunter; welche <b>retained</b> gesendet werden, steht in der Themen-Tabelle unten. Erlaubt sind Buchstaben, Ziffern, Unterstrich, Bindestrich und Schrägstriche als Trenner — ein <span class='sm-mono'>#</span> oder <span class='sm-mono'>+</span> wäre ein MQTT-Platzhalter und im Thema unzulässig. Wird der Präfix geändert, räumt der Dienst die zurückbehaltenen Werte unter dem alten Präfix beim Broker ab und liest nach; gelingt das nicht, steht es im Protokoll."
