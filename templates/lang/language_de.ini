SICH_WARNUNG = "<b>Die Datei ist ein Geheimnis.</b> Sie enthält das Aktionstoken, den Keycode des Beamers und die Microsoft-Anmeldung der Xbox - wer sie hat, kann Beamer und Konsole schalten. Ohne diese Werte stünden nach dem Zurückspielen alle Felder richtig, und das Plugin käme trotzdem nicht an die Geräte. Behandeln Sie die Datei wie ein Passwort: nur für Sie lesbar ablegen (wie eine Datei mit Rechten 0600), nicht in ein Forum hängen und nicht an einen Fehlerbericht heften."
SICH_ZU_GROSS = "Die Datei ist größer als erlaubt — eine Sicherung dieses Plugins ist wenige Kilobyte groß."
SZENE_AKTIV = "Kino-Szene verwenden"
SZENE_HILFE = "Eine Szene schaltet auf einen Befehl hin alles ein und beim Verlassen wieder ab — und sie <b>wartet auf echte Bedingungen</b> statt auf geratene Zeiten: bis der Steuerport des Beamers wirklich antwortet, und bis die Konsole wirklich <i>On</i> meldet. In Loxone ließe sich das nur mit Zeitgliedern nachbauen, die raten. <br>Ablauf bei <span class='sm-mono'>kino-an</span>: Wake-on-LAN → warten, bis der Beamer antwortet → Eingang → Bildmodus → Xbox wecken → warten, bis sie an ist. Bei <span class='sm-mono'>kino-aus</span> umgekehrt: erst die Konsole, dann der Beamer. Leere Felder werden übersprungen. Ausgeführt wird die Szene im <b>Dienst</b> — er ist die einzige Stelle, die den Beamer befragen darf, weil das Gerät nur eine Verbindung zur Zeit annimmt."
WAECHTER_HINWEIS = "Ein Wächter sieht jede Minute nach, ob der Dienst noch läuft, und startet ihn nötigenfalls neu. Wer ihn hier <b>anhält</b>, hält ihn dauerhaft an — der Wächter respektiert das und startet ihn nicht wieder."
XBOX_VERWENDEN = "Xbox verwenden"
