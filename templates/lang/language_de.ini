XBOX_ID_HILFE = "Sie steht <b>nicht</b> in Azure — Azure kennt nur die Anwendung, nicht die Konsole. Zwei Quellen: <b>Reiter Test &rarr; Konsolen suchen</b> holt die Liste aller Konsolen des Kontos samt Identität; oder an der Konsole unter <i>System &rarr; Konsoleninfo</i>, 16 Zeichen. Nicht die <i>Konsolen-ID</i>, nicht die <i>Globale Geräte-ID</i>, nicht die <i>Seriennummer</i>. Hier gehört die <b>Geräteidentität</b> hin, nicht der <b>Name</b> der Konsole."
