ZUSATZWERTE_HILFE = "<b>Ab Werk aus, und das mit Absicht.</b> Die Befehle <span class='sm-mono'>CURRENT_VOL</span> und <span class='sm-mono'>MUTE_STATE</span> sind an einem LG-<i>Fernseher</i> belegt; ob ein Beamer sie kennt, ist hier nicht gemessen. Eingeschaltet fragt der Dienst sie mit ab, solange das Gerät läuft. Ein Fehlschlag setzt <b>nicht</b> <span class='sm-mono'>last_error</span> — sonst machte eine Bequemlichkeit die Störungsmeldung unbrauchbar; er steht einmal täglich im Protokoll."

[BEAMER]
EINRICHTUNG = "<b>Vier Einstellungen am Gerät, ohne die das Plugin wirkungslos bleibt.</b> <b>1.</b> Verstecktes Menü öffnen: mit der Fernbedienung <i>Alle Einstellungen &rarr; Allgemein &rarr; Netzwerk</i> ansteuern, sodass <i>Netzwerk</i> markiert ist — und <b>nicht öffnen, nichts anklicken</b>. Dann zügig <b>8 2 8 8 8</b> tippen. Klappt es nicht, war es zu langsam oder eine Ebene zu tief; bei älteren Geräten heißt der Punkt <i>Netzwerkverbindung</i>. <b>2.</b> Dort <i>Netzwerk-IP-Steuerung</i> einschalten und einen <b>Keycode erzeugen</b> — acht Zeichen, unten eintragen. Ohne ihn nimmt das Gerät keinen Befehl an; ein neuer Keycode macht den alten ungültig. <b>3.</b> <i>Schnellstart+</i> einschalten (<i>Allgemein &rarr; Geräte &rarr; Zusätzliche Einstellungen</i>) — ohne das trennt das Gerät im Standby die Netzwerkschnittstelle, dann antwortet Port 9761 nicht mehr und Wake-on-LAN kommt gar nicht erst an. <b>4.</b> Kabel statt Funk und eine <b>feste Adresse</b> in der Fritz!Box; wandert sie, schlägt alles fehl, ohne dass die Ursache sichtbar würde. <br><b>Zwei Automatiken, die Störungen vortäuschen</b> (<i>Allgemein &rarr; System &rarr; Zusätzliche Einstellungen</i>): die <i>Ausschaltautomatik</i> nach vier Stunden ohne Bedienung und der <i>Bildschirmschoner</i>. Wer sich fragt, warum der Beamer „von selbst“ ausgeht, findet die Antwort meist hier und nicht in Loxone."

[XBOX]
EINRICHTUNG = "<b>Einstellungen an der Konsole.</b> Ohne die ersten beiden kommt kein Weckbefehl an — auch nicht über die Cloud. <b>1. Energiesparmodus auf <i>Ruhezustand</i></b> (<i>Profil &amp; System &rarr; Einstellungen &rarr; Allgemein &rarr; Energiesparmodus</i>). Steht dort <i>Energiesparen</i>, ist die Konsole im Aus wirklich aus und durch nichts zu wecken. <b>2. Remote-Features aktivieren</b> (<i>Geräte &amp; Verbindungen &rarr; Remote-Features</i>) — derselbe Schalter, den die Xbox-App braucht. <b>3. Geräteidentität ablesen</b> (<i>System &rarr; Konsoleninfo</i>): Feld <b>XBOX-Netzwerk-Geräteidentität</b>, 16 Zeichen. <b>4. HDMI-CEC</b> (<i>Allgemein &rarr; TV- &amp; A/V-Energieoptionen &rarr; HDMI-CEC</i>) für das Ausschalten des Verstärkers. <br><b>Zum Wecken taugt CEC nicht.</b> Die Konsole kennt nur: sie schaltet andere Geräte ein, sie schaltet andere Geräte aus, andere Geräte können sie <i>deaktivieren</i>. Eine Zeile „andere Geräte können die Konsole einschalten“ gibt es nicht — nachgesehen, nicht vermutet. Praktische Folge: <span class='sm-mono'>xbox-aus</span> ist oft überflüssig, weil der Verstärker das per CEC schon erledigt."
H_ANMELDUNG = "Xbox: Anmeldung bei Microsoft"
CLOUD_WARUM = "Das unauthentifizierte Weckpaket auf UDP 5050, mit dem sich Xbox-One-Konsolen wecken ließen, wird von neueren Firmwareständen ignoriert. Nachgemessen an einer Series X: Paketinhalt, Zieladresse und Gerätekennung waren richtig, die Konsole reagierte nicht — die Xbox-App weckt dieselbe Konsole ohne Weiteres, und sie geht über den Cloud-Dienst von Microsoft. Diesen Weg geht das Plugin deshalb auch. Der Preis: eine eigene App-Registrierung, eine einmalige Anmeldung und eine Internetverbindung."
VERZEICHNIS = "<b>Voraussetzung, an der die meisten scheitern:</b> die Registrierung braucht ein <b>Verzeichnis</b> (Mandant). Ein persönliches Microsoft-Konto hat keines. Unter <i>App-Registrierungen</i> steht dann „diesem Konto zugeordnet, jedoch in keinem Verzeichnis enthalten“, und <i>Neue Registrierung</i> öffnet kein Formular, sondern ein Fenster mit einem einzigen Knopf: <i>Abbrechen</i>. Ein Verzeichnis bekommt man über eine <b>Azure-Registrierung</b> (kostenloses Konto, verlangt Zahlungsdaten zur Identitätsprüfung) oder das <b>M365-Entwicklerprogramm</b>. <b>Danach unbedingt abmelden und neu anmelden</b> — die Portalsitzung trägt die Verzeichniszugehörigkeit in sich; eine Sitzung von vorher kennt das neue Verzeichnis nicht und meldet <span class='sm-mono'>AADSTS16000</span>."
SCHRITT0 = "<b>Schritt 0 — prüfen, ob das Verzeichnis wirklich da ist.</b> Im Azure-Portal oben rechts auf den Kontonamen, dann <i>Verzeichnis wechseln</i>. Unter <i>Alle Verzeichnisse</i> muss eines aufgelistet und ausgewählt sein. Steht dort „Keine Verzeichnisse gefunden“, ist alles Weitere zwecklos."
SCHRITT1 = "<b>Schritt 1 — Anwendung registrieren.</b> <i>App-Registrierungen &rarr; Neue Registrierung</i>. <b>Name</b> frei wählbar. <b>Unterstützte Kontotypen: Nur persönliche Microsoft-Konten</b> — die Konsole hängt an einem persönlichen Konto; das Verzeichnis wird nur gebraucht, um die Anwendung überhaupt anlegen zu dürfen. <b>Umleitungs-URI:</b> Typ <b>Web</b>, Adresse genau <span class='sm-mono'>%1</span>."
SCHRITT2 = "<b>Schritt 2 — Kennung abschreiben.</b> Auf der Seite <i>Übersicht</i> steht <b>Anwendungs-ID (Client)</b>. Sie ist kein Geheimnis. Nicht zu verwechseln mit <i>Verzeichnis-ID (Mandant)</i> oder <i>Objekt-ID</i>, die direkt darunter stehen."
SCHRITT3 = "<b>Schritt 3 — Geheimnis erzeugen.</b> <i>Zertifikate &amp; Geheimnisse &rarr; Geheime Clientschlüssel &rarr; Neuer geheimer Clientschlüssel</i>. Die Tabelle zeigt danach vier Spalten: <i>Beschreibung</i>, <i>Ablaufdatum</i>, <b>Wert</b> und <i>Geheime ID</i>. <b>Gebraucht wird die Spalte „Wert“.</b> Die Spalte „Geheime ID“ ist es <b>nicht</b> — sie sieht aus wie eine Kennung und wird deshalb regelmäßig verwechselt. Und „Wert“ ist <b>nur dieses eine Mal</b> sichtbar: wer die Seite verlässt, sieht sie nie wieder und muss ein neues Geheimnis anlegen."
SCHRITT4 = "<b>Schritt 4 — anmelden.</b> Diese Adresse in einem Browser öffnen und mit dem Microsoft-Konto anmelden, an dem die Konsole hängt."
SCHRITT4_HILFE = "Der Browser landet danach auf einer Seite, die nicht lädt — das ist richtig so. Entscheidend ist die Adresszeile: sie enthält <span class='sm-mono'>?code=…</span>. Die ganze Adresse kopieren und unten einsetzen."
INVALID_CLIENT = "Meldet Microsoft hier <span class='sm-mono'>invalid_client</span>, liegt es an einem von zwei Dingen: <b>1.</b> Es wurde die falsche Spalte kopiert — <i>Geheime ID</i> statt <i>Wert</i>. Der weitaus häufigste Fall; der Reiter <b>Test &rarr; Anmeldedaten prüfen</b> sagt, welche Form das gespeicherte Geheimnis hat, ohne es anzuzeigen. <b>2.</b> Das Geheimnis ist abgelaufen. Bleibt es dabei, obwohl die Spalte <i>Wert</i> frisch kopiert wurde, hilft der andere Anmeldedienst: in <span class='sm-mono'>xbox_auth.json</span> den Eintrag <span class='sm-mono'>dienst: v2</span> setzen. Manche Registrierungen nimmt nur der eine oder nur der andere an. <br>Meldet Microsoft dagegen <span class='sm-mono'>invalid_grant</span>, ist das Erneuerungstoken abgelaufen — dann verwirft das Plugin die gespeicherte Anmeldung von selbst und hier ist eine neue fällig."
ANGEMELDET = "Angemeldet. Das Erneuerungstoken liegt vor; eine neue Anmeldung ist erst nötig, wenn Microsoft es verwirft."
NICHT_ANGEMELDET = "Noch nicht angemeldet."

