SZENE_HAUSEREIGNIS_HILFE = "Ab Werk aus. Eingeschaltet meldet der Dienst beim Start von <span class='sm-mono'>kino-an</span> <span class='sm-mono'>haus/szene/kino = 1</span> und beim Start von <span class='sm-mono'>kino-aus</span> <span class='sm-mono'>= 0</span>, <b>retained</b> und <b>ohne</b> das Themenpräfix – ein festes Thema für Beschattungswächter, Licht und Loxone. Gesendet wird nur, wenn auch die Kino-Szene und MQTT an sind. Beim Abschalten und bei der Deinstallation räumt das Plugin das Thema am Broker ab."
