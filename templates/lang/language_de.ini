ABO_PFLICHT = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Einzutragen unter <i>System → MQTT Gateway → Abonnements</i> (gilt für Gateway-Fassung 1):"
ABO_UNBEKANNT = "Die Fassung des Gateways ließ sich nicht lesen, deshalb stehen beide Fälle da. Welche gilt, steht unter <i>System → MQTT Gateway</i>."
ABO_V2 = "<b>MQTT-Gateway V2 erkennt die Themengruppe von selbst</b> — einzutragen ist hier nichts. In den <i>Abonnements</i> erscheint die Gruppe; dort werden die gewünschten Datenpunkte einzeln angehakt. Der Themenbaum lautet:"
THEMEN_RETAINED = "<b>Zustände der Geräte</b> werden <b>retained</b> gesendet: ein neu verbundener Teilnehmer bekommt sofort den letzten Stand, nicht erst beim nächsten Durchlauf. Das Lebenszeichen <span class='sm-mono'>service/zeitstempel</span>, die Werte, die von selbst altern (Laufzeit des Tages: <span class='sm-mono'>beamer/laufzeit_heute</span>, <span class='sm-mono'>xbox/laufzeit_heute</span>; Tage bis zum Ablauf: <span class='sm-mono'>xbox/geheimnis_tage</span>), und alles, was der Dienst über sich selbst sagt (Fehler: <span class='sm-mono'>last_error</span>; Erreichbarkeit und Anmeldung: <span class='sm-mono'>beamer/erreichbar</span>, <span class='sm-mono'>beamer/grund</span>, <span class='sm-mono'>xbox/erreichbar</span>, <span class='sm-mono'>xbox/angemeldet</span>; Ergebnisse der Befehle: <span class='sm-mono'>beamer/letzte_aktion</span>, <span class='sm-mono'>xbox/letzte_aktion</span>; Ablauf und Ergebnis der Szene: <span class='sm-mono'>szene/laeuft</span>, <span class='sm-mono'>szene/schritt</span>, <span class='sm-mono'>szene/ergebnis</span>), gehen <b>ohne</b> Retain hinaus — ein alter Wert sähe sonst frisch aus. Konnte der Dienst ein Gerät nicht befragen (nicht erreichbar, Anmeldung oder Clientgeheimnis abgelaufen o. ä.), gehen seine Zustände in diesem Durchgang <b>gar nicht</b> hinaus, auch keine Ersatzwerte: Broker und Loxone behalten den zuletzt gemessenen Stand, nur <span class='sm-mono'>beamer/erreichbar</span> bzw. <span class='sm-mono'>xbox/erreichbar</span> geht auf 0. Ein in den Einstellungen abgeschaltetes Gerät bekommt <b>einmal</b> retained Platzhalter (<i>-</i> bei Text, -1 bei Zahlen, 0 bei den digitalen Eingängen <span class='sm-mono'>…/an</span> und <span class='sm-mono'>xbox/geheimnis_datum_bekannt</span>), danach geht für das Gerät im Takt nur noch <span class='sm-mono'>…/aktiv</span> = 0 hinaus. Die Spalte <i>retained</i> kommt aus derselben Liste, nach der der Dienst sendet. <span class='sm-mono'>service/online</span> trägt zusätzlich einen <b>letzten Willen</b> — bricht die Verbindung des Dienstes weg, setzt der Broker den Wert von sich aus auf 0. Die Deinstallation räumt alle behaltenen Themen des Plugins beim Broker ab."
HAUS_AN = "Zusätzlich, ohne Präfix: <span class='sm-mono'>haus/szene/kino</span> (0/1, <b>retained</b>) – die Kino-Szene als Hausereignis, eingeschaltet im Reiter Einstellungen."
HAUS_AUS = "Das Hausereignis <span class='sm-mono'>haus/szene/kino</span> ist abgeschaltet (Reiter Einstellungen, Kino-Szene)."

[LOX]
H_SCHRITTWEISE = "Einbindung in Loxone — Schritt für Schritt"
EINLEITUNG = "Das Plugin fragt Beamer und Xbox ab und meldet jeden Zustand als eigenes MQTT-Thema (Schritt 1 und 2). Umgekehrt nimmt es über einfache Adressen Befehle entgegen (Schritt 3). Daraus lässt sich eine Kino-Szene bauen, die auf Knopfdruck alles einschaltet und beim Verlassen wieder abräumt."
H_SCHRITT1 = "Schritt 1: Abo im MQTT-Gateway"
H_SCHRITT2 = "Schritt 2: Zustand lesen — virtuelle Eingänge"
SCHRITT2 = "Der Dienst meldet jeden Wert an den Broker, Zustände retained (Spalte <i>retained</i> im Reiter MQTT); das MQTT-Gateway von LoxBerry leitet ihn an den Miniserver weiter."
VORLAGE_HINWEIS = "Die Datei lässt sich in Loxone Config unter <i>Virtuelle Eingänge</i> einlesen. <b>Loxone Config legt beim Import neu an und überschreibt nichts</b> — zweimal importiert heißt doppelte Objekte. Die <b>Textthemen bleiben in der Vorlage außen vor</b>: das nachgebaute Dateiformat ist nur für Zahlenwerte belegt. Sie stehen in der Tabelle darüber und werden bei Bedarf von Hand angelegt. Die Adresse im Kopf ist ein Vorschlag — bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
VORLAGE_KOMMENTAR = "Erzeugt vom LoxBerry-Plugin Heimkino (%1)"
VO_KOMMENTAR = "Aktionsaufrufe über das Plugin Heimkino — enthält das Aktionstoken."
H_SCHRITT3 = "Schritt 3: Schalten — virtueller Ausgang"
SCHRITT3 = "In Loxone Config einen <b>virtuellen Ausgang</b> anlegen. Bei ihm steht nur die Adresse des LoxBerry; die Befehle kommen in die <b>virtuellen Ausgangsbefehle</b> darunter. Kein Benutzer und kein Passwort — der Aktionsendpunkt liegt im unangemeldeten Bereich und prüft stattdessen das Token. Statt des Rechnernamens geht auch die IP des LoxBerry."
KEIN_TOKEN = "Es gibt noch kein Aktionstoken. Einmal im Reiter <i>Einstellungen</i> speichern, dann erscheinen hier die vollständigen Adressen."
SP_FELD = "Feld"
SP_WERT = "Wert"
SP_BEFEHL = "Ausgangsbefehl"
SP_EIN = "Befehl bei EIN (Methode GET)"
ADRESSE_AUSGANG = "Adresse des Ausgangs"
FLANKE = "Ein virtueller Ausgangsbefehl feuert bei der Flanke 0→1, nicht dauerhaft. Bei <span class='sm-mono'>beamer-taste</span> und <span class='sm-mono'>beamer-eingang</span> steht statt <span class='sm-mono'>WERT</span> der gewünschte Name; erlaubt sind Buchstaben, Ziffern und Unterstrich, und Groß- und Kleinschreibung bleibt erhalten."
H_SCHRITT4 = "Schritt 4: Adresse prüfen, ohne zu schalten"
SCHRITT4 = "Jeder Aktionsendpunkt beantwortet einen Selbsttest. Er prüft <b>nur</b>, ob das Token stimmt: kein Gerätekontakt, kein Schreibzugriff, es wird nichts geschaltet. Damit lässt sich eine Anlage prüfen, ohne dass der Beamer herunterfährt."
SELFTEST_ANTWORT = "Antwort bei richtigem Token: <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span> mit HTTP 200. Bei falschem Token <span class='sm-mono'>SELFTEST;OK=0;ERR=TOKEN</span> mit HTTP 403, ohne eingerichtetes Token <span class='sm-mono'>SELFTEST;OK=0;ERR=KEIN_TOKEN_EINGERICHTET</span>."
H_SCHRITT5 = "Schritt 5: Ausfallerkennung"
AUSFALL = "<b>Virtuelle Eingänge behalten ihren letzten Wert.</b> Fällt der Dienst aus, sieht in der App alles normal aus — die Werte stehen einfach still. Zwei Themen erkennen das: <span class='sm-mono'>%1/service/online</span> geht auf 0, sobald die Verbindung des Dienstes wegbricht (der Broker setzt das selbst über den letzten Willen), und <span class='sm-mono'>%1/service/zeitstempel</span> trägt die Unix-Zeit der letzten Abfrage. Auf den Zeitstempel eine <i>Analogwertvalidierung</i> setzen (Tmc das Dreifache des Abfragetakts, Konstante 1 an En): ihr Ausgang E meldet, wenn er sich so lange nicht ändert; zusammen mit <span class='sm-mono'>service/online</span> = 0 (über ein NICHT) läuft beides über ein ODER in eine Benachrichtigung – Seite „Heimkino“, #14 bis #23 in Schritt 7. Die Schwelle deutlich über den Takt legen, sonst löst ein einzelner verpasster Durchlauf schon eine Meldung aus. Für Loxone von der Unix-Zeit 1230768000 abziehen."
H_SCHRITT6 = "Schritt 6: Kachel in der App"
SCHRITT6 = "Die Kachel ist der <i>Status</i>-Baustein „Heimkino“ (#13 der Seite „Heimkino“ in Schritt 7): <span class='sm-mono'>V1</span> mit <span class='sm-mono'>beamer_an</span>, <span class='sm-mono'>V2</span> mit <span class='sm-mono'>xbox_an</span> verbinden und die vier Statuszeilen aus der Spalte <i>Parameter</i> von Hand eintragen – die Zeile ohne Bedingung zuletzt. Häkchen <i>In Visualisierung verwenden</i> setzen. Weitere Kacheln (Dienst, Kino-Szene, Geräte, letzte Befehle) stehen ebenfalls in Schritt 7."
H_SCHRITT7 = "Schritt 7: Vier komplette Baustein-Listen zum Nachbauen"
BAUSTEINE_EINLEITUNG = "Vier Seiten aus dem LoxBerry-Plugins Musterprojekt, jede Zeile ein Baustein (Baustein-Suche in Loxone Config: Taste <b>F5</b>). Die erste zeigt, ob das Kino läuft, startet die Kino-Szene und meldet Ausfälle – sie genügt für den Anfang. Die zweite legt die Befehle an Beamer und Xbox als Tasten in die App (die Türklingel blendet das Bild aus), die dritte zeigt Verbindung und Werte der Geräte, die vierte stellt Lautstärke, HDMI-Eingang und Bildmodus. Die Eingänge kommen aus der Vorlage aus Schritt 2, die Befehle aus den Vorlagen aus Schritt 3; die Namen der Eingänge vergibt das MQTT-Gateway – sie bleiben, wie sie sind."
SP_BAUSTEIN = "Baustein (Typ)"
SP_NAME = "Name (Vorschlag)"
SP_PARAMETER = "Parameter"
SP_VERBINDEN = "Eingänge verbinden mit"
H_SCHRITT8 = "Schritt 8: Gegenprobe"
GEGENPROBE = "So prüft man, ob es angekommen ist, ohne etwas zu schalten: <b>1.</b> Im Reiter <i>Test</i> die Zeile <i>Antwortet der eigene Endpunkt?</i> ansehen — sie ruft die Selbsttest-Adresse wirklich auf. <b>2.</b> Im MQTT Gateway unter <i>Incoming overview</i> nach <span class='sm-mono'>%1/</span> suchen; dort müssen alle Themen mit Wert stehen. <b>3.</b> In Loxone Config die virtuellen Eingänge im Monitor beobachten und den Dienst einmal anhalten — <span class='sm-mono'>service/online</span> muss binnen weniger Sekunden auf 0 gehen. Bleibt es auf 1, kommt der letzte Wille nicht durch, und die Ausfallerkennung trüge nicht."
SZENE = "<b>Die Kino-Szene ist der kürzere Weg.</b> Statt vier Ausgangsbefehle zu verdrahten und die Wartezeiten mit Zeitgliedern zu raten, genügt ein virtueller Ausgang mit <span class='sm-mono'>kino-an</span> und <span class='sm-mono'>kino-aus</span>. Der Dienst arbeitet die Schritte ab und wartet dabei auf echte Bedingungen: bis der Steuerport wirklich antwortet und bis die Konsole wirklich <i>On</i> meldet. Der Aufruf kehrt sofort zurück — Loxone wartet nicht. Wo die Szene gerade steht, sagt <span class='sm-mono'>szene/schritt</span>; wie sie ausging, <span class='sm-mono'>szene/ergebnis</span>."
BREMSE = "<b>Derselbe Sollwert geht höchstens einmal je Minute hinaus.</b> Für <span class='sm-mono'>beamer-aus</span>, <span class='sm-mono'>kino-an</span>/<span class='sm-mono'>kino-aus</span>, <span class='sm-mono'>beamer-lautstaerke</span>, <span class='sm-mono'>beamer-eingang</span>, <span class='sm-mono'>beamer-bildmodus</span>, <span class='sm-mono'>beamer-energie</span>, <span class='sm-mono'>beamer-bild-an</span>/<span class='sm-mono'>-aus</span>, <span class='sm-mono'>beamer-stumm-an</span>/<span class='sm-mono'>-aus</span> und <span class='sm-mono'>xbox-an</span>/<span class='sm-mono'>xbox-aus</span> gilt: Kommt derselbe Befehl mit demselben Wert innerhalb von 60 s noch einmal, antwortet der Endpunkt mit HTTP 200 und <span class='sm-mono'>UNVERAENDERT=1</span> und sendet nichts. Ein anderer Wert geht sofort hinaus. Nach Ein- oder Ausschalten, einer Kino-Szene oder einer Taste gilt nichts mehr als gemerkt. <span class='sm-mono'>beamer-taste</span>, <span class='sm-mono'>beamer-app</span> und <span class='sm-mono'>beamer-wol</span> (Wake-on-LAN ohne Rückmeldung) gehen immer hinaus. Für die Xbox gilt zusätzlich: ein anderer Wert höchstens alle 10 s (sonst 429)."
BILD_ALT = "Bausteine des Plugins in Loxone Config – Seite „%s“"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
BL_KINO = "Zustand, Kino-Szene und Meldungen"
BL_STEUERUNG = "Steuerung"
BL_GERAETE = "Geräte"
BL_BILDTON = "Bild und Ton"
BT_KOMMENTAR = "Bild und Ton des Beamers über das Plugin Heimkino — enthält das Aktionstoken."
BT_HINWEIS = "Die Vorlage <i>Heimkino Bild und Ton</i> enthält zwölf weitere Befehle: Lautstärke setzen (Analogwert eines Reglers), Eingang HDMI 1 bis 4 und sieben Bildmodi – Liste in Schritt 7, Seite „Heimkino Bild und Ton“. Sie ist eine eigene Datei, damit eine schon eingelesene Vorlage <i>Heimkino steuern</i> unverändert bleibt; auch sie enthält das Aktionstoken. Die Titel aller Befehle stehen fest auf Deutsch, damit sie in Loxone Config so heißen wie im Musterprojekt."

