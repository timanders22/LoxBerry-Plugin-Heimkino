SZENE_HILFE = "Eine Szene schaltet auf einen Befehl hin alles ein und beim Verlassen wieder ab — und sie <b>wartet auf echte Bedingungen</b> statt auf geratene Zeiten: bis der Steuerport des Beamers wirklich antwortet, und bis die Konsole wirklich <i>On</i> meldet. In Loxone ließe sich das nur mit Zeitgliedern nachbauen, die raten. <br>Ablauf bei <span class='sm-mono'>kino-an</span>: Wake-on-LAN &rarr; warten, bis der Beamer antwortet &rarr; Eingang &rarr; Bildmodus &rarr; Xbox wecken &rarr; warten, bis sie an ist. Bei <span class='sm-mono'>kino-aus</span> umgekehrt: erst die Konsole, dann der Beamer. Leere Felder werden übersprungen. Ausgeführt wird die Szene im <b>Dienst</b> — er ist die einzige Stelle, die den Beamer befragen darf, weil das Gerät nur eine Verbindung zur Zeit annimmt."
