; Heimkino - Deutsch
; Jeder hier benutzte Schluessel muss auch in language_en.ini stehen.
;
; REGELN FUER DIESE DATEI:
;   - Attribute in Markup EINFACH quotieren: class='sm-mono'. Ein zweites
;     doppeltes Anfuehrungszeichen beendet den Wert vorzeitig, und zwar
;     STUMM - je nach Lesemodus wird der Wert abgeschnitten oder die ganze
;     Datei abgewiesen.
;   - Anfuehrung typografisch: "so", nie "so".
;   - Ein Wert kann NICHT ueber mehrere Zeilen gehen.
;   - Werte, die durch hk_te() laufen (Beschriftungen, Ueberschriften,
;     Knopftexte, alle PRUEF.*, UMG.* und ANM.*), enthalten KEINE
;     HTML-Entitaeten - sonst steht woertlich "l&auml;uft" am Bildschirm.

