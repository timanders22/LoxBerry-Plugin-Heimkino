FRIST_HILFE = "<b>Der geheime Clientschlüssel hält höchstens 24 Monate.</b> Azure vergibt keine längere Frist. Läuft er ab, antwortet Microsoft mit <span class='sm-mono'>invalid_client</span> und die Konsole lässt sich nicht mehr aus Loxone wecken — zwei Jahre nach der Einrichtung, wenn niemand mehr daran denkt. Der Dienst meldet Datum und Restlaufzeit per MQTT und schreibt ab 60 Tagen eine Warnung ins Protokoll. <b>Erneuern:</b> in Azure ein neues Geheimnis anlegen, die Spalte <i>Wert</i> eintragen, die Anmeldung wiederholen, das alte löschen. Anwendungskennung und Geräteidentität bleiben unverändert."
