S1_SCHRITT1 = "Im Plugin Reiter „%s“ den Beamer (%s, %s, Keycode) und die Xbox (Anmeldung, %s, „%s“) einrichten, „%s“ einschalten, Eingang und Bildmodus der Szene wählen und speichern. Beim ersten Speichern entsteht das Aktionstoken."
S1_SCHRITT2 = "LoxBerry → MQTT Gateway → Abonnements: %s eintragen (Gateway V2: die Gruppe erscheint von selbst, dort alle Datenpunkte anhaken – auch die Textthemen dieser Liste). Was für das eigene Gateway gilt, steht oben in Schritt 1."
S1_SCHRITT3 = "Oben in diesem Reiter „%s“ (Schritt 2) und „%s“ (Schritt 3) drücken. Die Adresse im Kopf prüfen: unter diesem Namen muss der Miniserver den LoxBerry erreichen (sonst die IP-Adresse eintragen)."
S1_SCHRITT4 = "In Loxone Config: Peripherie → Virtuelle Eingänge → Vorlage importieren → %s; Peripherie → Virtuelle Ausgänge → Vorlage importieren → %s. Jede Datei nur EINMAL einlesen (zweimal ergibt doppelte Bausteine)."
S1_SCHRITT5 = "Neue Seite „Heimkino“ anlegen. Aus „%s“ %s auf die Seite ziehen; aus „%s“ die zwei Befehle „%s“ und „%s“."
S1_SCHRITT6 = "Vier Texteingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so: %s – so, wie das MQTT-Gateway die Themen benennt (Schrägstrich wird Unterstrich, vorn das Themen-Präfix aus dem Reiter MQTT)."
S1_SCHRITT7 = "Schalter „Kino-Modus“ anlegen (Virtueller Eingang, Eingabeart Schalter, „In Visualisierung verwenden“ an)."
S1_SCHRITT8 = "Vier Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Beamer startet nicht“, „Xbox-Geheimnis erneuern“, „Heimkino ausgefallen“, „Kino-Szene unvollständig“, Texte wie in der Liste. Jede bekommt genau eine Leitung."
S1_SCHRITT9 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. UND und ODER haben je zwei Eingänge. Die Zeilen der Status-Bausteine stehen in der Spalte „%s“ und werden von Hand eingetragen – in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt, Statuswert wie angegeben. Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein; die Status dieser vier Seiten brauchen höchstens V4."
S1_SCHRITT10 = "Speichern und in den Miniserver übertragen. Gegenprobe: „Heimkino-Dienst“ zeigt „in Ordnung – letzte Abfrage …“; Kino-Modus einschalten – „Kino-Szene“ zeigt die Schritte, danach „zuletzt: kino-an vollstaendig nach … s“."
S1_H1 = "Zu #6 und #7: Ein virtueller Ausgangsbefehl feuert bei der Flanke 0→1, nicht dauerhaft – deshalb die Flankenerkennung #5 mit ihren beiden Ausgängen On und Off. Der Kino-Modus allein löste beim Einschalten genau einmal aus und beim Ausschalten gar nicht."
S1_H2 = "Kino-Modus ist ein Virtueller Eingang (Schalter) für die App; ebenso geht ein Taster oder eine Szene. Die Flankenerkennung schickt beim Einschalten „%s“, beim Ausschalten „%s“. Dafür im Reiter „%s“ „%s“ einschalten – ab Werk ist sie aus, und das Plugin weist beide Befehle ab."
S1_H3 = "Zu #9: Die Kino-Szene wartet bis zu 120 s auf den Beamer, und sein Zustand kommt mit dem Abfragetakt von 60 s – deshalb 180 s. Eine kürzere Verzögerung meldet einen Fehlstart, während das Plugin noch wartet."
S1_H4 = "Die Analogwertvalidierung (#18) bekommt an En die Konstante 1. Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus. Wer den Abfragetakt im Plugin ändert, setzt Tmc auf das Dreifache des neuen Takts."
S1_H5 = "„Beamer startet nicht“ (#10) und „Kino-Szene unvollständig“ (#28) können beim selben Fehlstart beide kommen: die erste sagt, dass der Beamer nicht an ist, die zweite, welcher Schritt der Szene fehlte. Ist „%s“ aus, kommt nur die erste – der Kino-Modus schaltet dann gar nichts."
S1_H6 = "Eine Benachrichtigung sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an ihren Eingang legen – erst über ein ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen."
S1_H7 = "„Kino-Modus“ bleibt beim Verlassen des Hauses stehen; wer Kino nach dem Gehen ausschalten will, schaltet ihn in der App aus – ein Baustein kann den Schalter nicht zurücksetzen."
S1_H8 = "Nach einem Neustart des Miniservers zeigt „Kino-Szene“ bis zur nächsten Szene „seit dem Neustart noch keine Szene gelaufen“: das Ergebnis wird nicht zurückbehalten, damit kein alter Stand frisch aussieht."
S1_H9 = "Wer Beschattungswächter oder Licht auf das Kino reagieren lassen will: im Plugin „%s“ einschalten; die Abnehmer lesen es selbst, in Loxone ist dafür nichts zu bauen."
S1_H10 = "Die Vorlage „%s“ enthält das Aktionstoken des Plugins. Nach „Neues Token erzeugen“ beide Ausgangsvorlagen neu erzeugen oder die Adressen von Hand anpassen."
S2_SCHRITT1 = "Vorlagen wie auf Seite „Heimkino“ (ein Import reicht für alle Seiten)."
S2_SCHRITT2 = "Neue Seite „Heimkino Steuerung“. Aus „%s“ die acht Befehle %s ziehen. Die zwei „Kino-Szene: …“ NICHT noch einmal – ein Ausgangsbefehl darf nur einmal im Projekt stehen."
S2_SCHRITT3 = "Acht Tasten anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang, Eingabeart Taster, „In Visualisierung verwenden“ an), Namen wie in der Liste."
S2_SCHRITT4 = "Türklingel: Wer schon eine Klingel im Projekt hat (z. B. für Kodi oder Chromecast), zieht genau diese ein weiteres Mal auf die Seite und legt sie an #8 „Klingel bei laufendem Beamer“ (Eingang I1). Ohne eigene Klingel den Platzhalter „Türklingel (eigene Quelle)“ als Taste anlegen. %s ein weiteres Mal aus dem Baum ziehen."
S2_SCHRITT5 = "Zwei Texteingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so: %s."
S2_SCHRITT6 = "Benachrichtigung „Heimkino-Befehl ohne Wirkung“ anlegen (Text wie in der Liste); UND, ODER und Status setzen und nach der Spalte „%s“ verbinden. UND und ODER haben je zwei Eingänge; die Zeilen des Status stehen in der Spalte „%s“ und werden von Hand eingetragen."
S2_SCHRITT7 = "Speichern, übertragen. Probe: Der Beamer läuft, in der App „Türklingel (eigene Quelle)“ drücken – Bild und Ton gehen aus; „Beamer Bild an“ – das Bild ist wieder da. „Letzte Befehle“ zeigt nach einem Schaltbefehl „… gewirkt nach … s“."
S2_H1 = "Klingeln blendet nur das Bild aus; den Film hält die Seite „Kodi-NG Wiedergabe“ des Kodi-Plugins an (derselbe Platzhalter). Nach dem Gespräch „Kodi abspielen“ und „Beamer Bild an“ drücken – das Bild kommt nicht von selbst zurück."
S2_H2 = "Denselben Befehl innerhalb von 60 s nimmt das Plugin nicht doppelt an (Antwort UNVERAENDERT=1, kein Fehler). Die Xbox nimmt höchstens alle 10 s einen anderen Befehl an."
S2_H3 = "„Beamer an“ wirkt nur, wenn am Beamer „Schnellstart+“ an ist und im Plugin die MAC-Adresse stimmt (Reiter „%s“: „%s“)."
S2_H4 = "„Letzte Befehle“ füllt sich nur mit dem Haken „%s“ (ab Werk an); „nicht feststellbar“ heißt: das Gerät hat gar nicht geantwortet – kein Fehlschlag, keine Meldung."
S3_SCHRITT1 = "Vorlagen wie auf Seite „Heimkino“ (kein zweiter Import)."
S3_SCHRITT2 = "Neue Seite „Heimkino Geräte“. Aus „%s“ die 13 Eingänge der Liste ziehen (%s und %s ein weiteres Mal – das ist erlaubt). Bei %s und %s im Eigenschaftsfenster „Statistik“ einschalten."
S3_SCHRITT3 = "Vier Texteingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so: %s."
S3_SCHRITT4 = "Zwei Benachrichtigungen „Beamer nicht erreichbar“ und „Xbox nicht erreichbar“ anlegen (Texte wie in der Liste)."
S3_SCHRITT5 = "Fünf Status und zwei Einschaltverzögerungen setzen und nach der Spalte „%s“ verbinden. Die Zeilen der Status stehen in der Spalte „%s“ und werden von Hand in der angegebenen Reihenfolge eingetragen – die Zeile „fehler“ der Beamer-Verbindung VOR „Beamer antwortet“, sonst verdeckt sie einen falschen Keycode."
S3_SCHRITT6 = "Speichern, übertragen. Probe: „Beamer-Verbindung“ zeigt bei ausgeschaltetem Beamer „Beamer aus (Standby) – normal“ oder „nicht im Netz“; „Xbox-Verbindung“ zeigt „Xbox-Cloud antwortet – Konsole: …“."
S3_H1 = "Ein ausgeschalteter Beamer antwortet nicht – das ist kein Fehler. Gemeldet wird nur, was eingerichtet werden muss (Adresse, Name, Keycode); „nicht im Netz“ meldet nichts, weil das ohne „Schnellstart+“ der Normalfall im Standby ist."
S3_H2 = "Lautstärke und Stummschaltung stehen auf -1, bis im Plugin „%s“ eingeschaltet ist; ob der eigene Beamer sie kennt, zeigt sich erst dann (an einem Fernseher belegt, am Beamer nicht gemessen)."
S3_H3 = "Betriebsstunden sind geschätzt (aus dem Abfragetakt) und zählen ab der ersten Abfrage dieser Plugin-Fassung – kein Lampenzähler."
S4_SCHRITT1 = "Oben in Schritt 3 „%s“ drücken und die Datei %s in Loxone Config unter Peripherie → Virtuelle Ausgänge → Vorlage importieren einmal einlesen. Die Vorlage „%s“ bleibt unverändert."
S4_SCHRITT2 = "Neue Seite „Heimkino Bild und Ton“. Aus „%s“ alle zwölf Befehle ziehen. Einen Schieberegler „Beamer Lautstärke einstellen“ (Virtueller Eingang, Eingabeart Schieberegler, Min 0, Max 100, Schrittweite 5) und elf Tasten (Eingabeart Taster, „In Visualisierung verwenden“ an) anlegen, Namen wie in der Liste, nach der Spalte „%s“ verbinden."
S4_SCHRITT3 = "Speichern, übertragen. Probe: „Beamer Bild Spiel“ drücken – der Beamer wechselt den Bildmodus."
S4_H1 = "Welche HDMI-Buchse der LoxBerry (Kodi), die Xbox oder ein Zuspieler belegt, steht am Beamer; überflüssige Tasten löschen."
S4_H2 = "Den Bildmodus beim Kino-Start setzt schon die Kino-Szene (Reiter „%s“, „%s“) – die Tasten sind zum Umschalten danach."
S4_H3 = "Derselbe Wert geht innerhalb von 60 s nicht noch einmal hinaus (Antwort UNVERAENDERT=1, kein Fehler). Keiner der zwölf Befehle ist an einem Beamer gemessen; Lautstärke setzen ist an einem LG-Fernseher belegt."
