; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Heimkino"
K02 = "Schaltet einen LG-Beamer und eine Xbox vom Miniserver aus und meldet ihren Zustand per MQTT zurück."
K03 = "Was dieses Plugin nicht tut"
K04 = "Den <b>Beamer einschalten</b> — das kann Loxone selbst. Ein virtueller Ausgang mit der Adresse <code>wol://</code> und der MAC ohne Trennzeichen als Befehl genügt. Der Umweg über den LoxBerry wäre länger und störanfälliger."
K05 = "Einstellungen am LG-Beamer"
K06 = "<b>Das versteckte Menü.</b> Mit der Fernbedienung <i>Alle Einstellungen → Allgemein → Netzwerk</i> ansteuern, sodass <i>Netzwerk</i> markiert ist — und <b>nicht öffnen, nichts anklicken</b>. Dann zügig die Ziffern <b>8&nbsp;2&nbsp;8&nbsp;8&nbsp;8</b> tippen. Es klappt ein Menü auf, das im normalen Betrieb nicht sichtbar ist. Klappt es nicht: zu langsam getippt, oder es war schon eine Ebene tiefer — einmal ganz heraus und neu ansteuern. Bei älteren Geräten heißt der Punkt <i>Netzwerkverbindung</i>."
K07 = "<b>Dort: Netzwerk-IP-Steuerung einschalten und einen Keycode erzeugen</b> — acht Zeichen, in die Einstellungen eintragen. Ohne Keycode nimmt das Gerät keinen Befehl an. Ein neu erzeugter Keycode macht den alten ungültig."
K08 = "<b>Schnellstart+ einschalten</b> (<i>Allgemein → Geräte → Zusätzliche Einstellungen</i>). Ohne Schnellstart+ trennt das Gerät im Standby die Netzwerkschnittstelle: Port 9761 antwortet nicht mehr, und Wake-on-LAN kommt gar nicht erst an."
K09 = "<b>LAN statt WLAN, feste Adresse in der Fritz!Box.</b> Kabel ist im Standby zuverlässiger. Wandert die Adresse, schlägt alles fehl, ohne dass die Ursache sichtbar würde."
K10 = "<b>Zwei Automatiken, die Störungen vortäuschen</b> (<i>Allgemein → System → Zusätzliche Einstellungen</i>): die <i>Ausschaltautomatik</i> schaltet nach vier Stunden ohne Bedienung ab, dazu der <i>Bildschirmschoner</i>. Wer sich fragt, warum der Beamer „von selbst“ ausgeht, findet die Antwort meist hier und nicht in Loxone."
K11 = "Einstellungen an der Xbox"
K12 = "<b>Energiesparmodus auf <i>Ruhezustand</i></b> (<i>Profil &amp; System → Einstellungen → Allgemein → Energiesparmodus</i>). Steht dort <i>Energiesparen</i>, ist die Konsole im Aus wirklich aus und durch nichts zu wecken — auch nicht über die Cloud."
K13 = "<b>Remote-Features einschalten</b> (<i>Geräte &amp; Verbindungen → Remote-Features</i>). Derselbe Schalter, den die Xbox-App braucht."
K14 = "<b>Geräteidentität ablesen</b> (<i>System → Konsoleninfo</i>): Feld <b>XBOX-Netzwerk-Geräteidentität</b>, 16 Zeichen. Nicht die <i>Konsolen-ID</i>, nicht die <i>Globale Geräte-ID</i>, nicht die <i>Seriennummer</i>."
K15 = "<b>Feste Adresse, möglichst LAN.</b> Im Ruhezustand verlängert WLAN die Weckzeit merklich."
K16 = "Der geheime Clientschlüssel hält höchstens 24 Monate"
K17 = "Azure vergibt für einen geheimen Clientschlüssel keine längere Frist — auch nicht mit eigenem Datum. Läuft er ab, antwortet Microsoft mit <code>invalid_client</code> und die Konsole lässt sich nicht mehr aus Loxone wecken. Das passiert zwei Jahre nach der Einrichtung, wenn niemand mehr daran denkt."
K18 = "Deshalb gehört das Ablaufdatum in die Einstellungen. Das Plugin trägt beim Speichern eines neuen Geheimnisses von sich aus 24 Monate ein, zeigt die Restlaufzeit im Reiter <i>Test</i>, schreibt ab 60 Tagen eine Warnung ins Protokoll und meldet Datum und Resttage per MQTT (<code>xbox/geheimnis_ablauf</code>, <code>xbox/geheimnis_tage</code>) — damit Loxone rechtzeitig eine Nachricht schicken kann."
K19 = "<b>Erneuern:</b> in Azure unter <i>Zertifikate &amp; Geheimnisse</i> ein neues Geheimnis anlegen, die Spalte <i>Wert</i> eintragen, die Anmeldung wiederholen, das alte Geheimnis löschen. Anwendungskennung und Geräteidentität bleiben."
K20 = "Xbox: warum über die Cloud"
K21 = "Das alte Weckpaket auf UDP 5050 wird von neueren Firmwareständen ignoriert. Nachgemessen: Paketinhalt, Zieladresse und Gerätekennung waren richtig, die Konsole reagierte nicht — die Xbox-App weckt dieselbe Konsole ohne Weiteres, und die geht über die Cloud. Der Preis ist eine eigene App-Registrierung bei Microsoft und eine Internetverbindung."
K22 = "<b>CEC weckt die Konsole nicht.</b> Unter <i>Allgemein → TV- &amp; A/V-Energieoptionen → HDMI-CEC</i> gibt es „Konsole schaltet andere Geräte ein/aus“ und „andere Geräte können die Konsole <i>deaktivieren</i>“ — aber keine Zeile, mit der andere Geräte die Konsole <i>einschalten</i> dürften. CEC kann sie also ausschalten, nicht wecken. Fürs Ausschalten heißt das: der Verstärker erledigt das schon, <code>xbox-aus</code> ist dann überflüssig."
K23 = "<b>Hürde bei der Registrierung:</b> ein persönliches Microsoft-Konto ohne Verzeichnis kann im Azure-Portal keine Anwendung mehr registrieren — <i>Neue Registrierung</i> öffnet dann nur ein Fenster mit dem Knopf <i>Abbrechen</i>. Es braucht erst ein Verzeichnis, über eine Azure-Registrierung oder das M365-Entwicklerprogramm."
K24 = "Am Gerät erprobt"
K25 = "Seit dem 30.07.2026 läuft das Plugin an einem echten LG-Beamer und einer echten Xbox Series X: Beamer aus über die IP-Steuerung, Beamer ein per Wake-on-LAN, Xbox wecken und ausschalten über die Cloud, Zustandsmeldungen per MQTT. Bis dahin war die Gegenstelle in allen Prüfungen eine Attrappe."
K26 = "Abfragetakt"
K27 = "Ein LG-Gerät nimmt nur eine Verbindung zur Zeit an. Ein zu kurzer Takt sperrt die Fernbedienung der App aus. 60 Sekunden sind eine gute Vorgabe."
K28 = "Wenn nichts geht"
K29 = "<i>Test → Umgebung prüfen</i> — fehlen Python-Module? Läuft der Dienst? Ist ein MQTT-Broker eingetragen?"
K30 = "<i>Test → Verschlüsselung prüfen</i> — rechnet das Plugin richtig? Dieser Test braucht kein Gerät."
K31 = "<i>Test → Beamer erreichbar?</i> — antwortet Port 9761 überhaupt? Ein ausgeschalteter Beamer im Tiefschlaf antwortet nicht; das ist normal."
K32 = "Meldung „Die Antwort ließ sich nicht lesen“ — dann stimmt der Keycode nicht. Am Gerät neu erzeugen und hier eintragen."
K33 = "Feste IP-Adressen in der Fritz!Box vergeben. Wandernde Adressen sind die häufigste Ursache für Fehler, die gestern noch nicht da waren."
K34 = "Xbox: Meldung <code>invalid_client</code> — entweder wurde die Spalte <i>Geheime ID</i> statt <i>Wert</i> kopiert, oder das Geheimnis ist nach höchstens 24 Monaten abgelaufen. Der Reiter <i>Test</i> zeigt beides."
K35 = "Xbox lässt sich nicht wecken, obwohl alles eingerichtet ist: an der Konsole <i>Energiesparmodus</i> auf <i>Ruhezustand</i> und <i>Remote-Features</i> prüfen. Ohne diese zwei kommt kein Weckbefehl an."
