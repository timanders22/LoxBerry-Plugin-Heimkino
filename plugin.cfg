[AUTHOR]
# NEVER CHANGE this information in future updates! It is used to identify
# the plugin and handle updates.
NAME=Heimkino Plugin Authors
EMAIL=heimkino@users.noreply.github.com

[PLUGIN]
VERSION=1.0.4
NAME=Heimkino
FOLDER=heimkino
TITLE=Heimkino

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=2.0
LB_MAXIMUM=false
# Reines Python und PHP, keine Architekturbindung.
ARCHITECTURE=
CUSTOM_LOGLEVELS=false

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository).
# Bei einem neuen Release: VERSION hier und in release.cfg erhoehen,
# Tag vX.Y.Z anlegen - installierte LoxBerrys ziehen dann automatisch nach.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Heimkino/main/release.cfg
PRERELEASECFG=
