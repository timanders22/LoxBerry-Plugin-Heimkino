; Heimkino
; Wird von der Plugin-Oberflaeche geschrieben. Diese Datei liegt dem Paket mit
; leeren Werten bei, damit die Voreinstellungen von Anfang an feststehen.
;
; ACHTUNG: Nach dem Einrichten enthaelt diese Datei den Keycode des Beamers.
; Sie gehoert nicht in ein oeffentliches Repository.

[heimkino]
enabled=1
intervall=60
themenpraefix=heimkino
mqtt=1
aktionstoken=
nachfassen=1
; Seit 1.3.30: HTTP-Endpunkt fuer Loxone (ab Werk aus; ein Update mit Aktionstoken setzt 1) und die beiden
; Haken der Befehlsbruecke (Befehle ueber MQTT annehmen, eingreifende Befehle zulassen; ab Werk aus).
endpunkt_ein=0
befehle_mqtt_ein=0
befehle_mqtt_steuern=0

[beamer]
aktiv=0
ip=
mac=
keycode=
port=9761
zeitgrenze=5
zusatzwerte=0

[xbox]
aktiv=0
geraete_id=
; Ablaufdatum des Azure-Clientgeheimnisses, JJJJ-MM-TT. Azure vergibt hoechstens
; 24 Monate. Steht hier ein Datum, warnt die Oberflaeche und der Dienst meldet
; die Restlaufzeit per MQTT - dann muss sich niemand den Termin merken.
geheimnis_ablauf=

[szene]
aktiv=0
eingang=
bildmodus=
warten_beamer=120
warten_xbox=90
hausereignis=0
